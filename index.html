<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <title>Hello, World!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body>
    <div class="container py-4 px-3 py-sm-5">
      <h2 class="title mb-4 mb-sm-5 text-center">Quiz en español</h2>
      
      <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">
          
          <div class="players d-flex justify-content-between flex-column flex-sm-row gap-2 mb-3">
            <h4 class="player quiz text-center">Player 1</h4>
            <h4 class="player text-center">Player 2</h4>
          </div>
          
          <div class="card mb-4 p-3 text-center">
            <span>¿Cómo se chama "cachorro" em espanhol?</span>
          </div>
          
          <div class="row g-2 responces mb-3">
            <div class="col-12 col-sm-6">
              <button type="button" class="w-100 h-100 option p-0 text-start">
                <div class="alert alert-success m-0 h-100 d-flex align-items-center" role="alert">A: Perro</div>
              </button>
            </div>
            <div class="col-12 col-sm-6">
              <button type="button" class="w-100 h-100 option p-0 text-start">
                <div class="alert alert-danger m-0 h-100 d-flex align-items-center" role="alert">B: Cacholo</div>
              </button>
            </div>
            <div class="col-12 col-sm-6">
              <button type="button" class="w-100 h-100 option p-0 text-start">
                <div class="alert alert-dark m-0 h-100 d-flex align-items-center" role="alert">C: Dog</div>
              </button>
            </div>
            <div class="col-12 col-sm-6">
              <button type="button" class="w-100 h-100 option p-0 text-start">
                <div class="alert alert-light m-0 h-100 d-flex align-items-center" role="alert">D: Nenhuma opção</div>
              </button>
            </div>
          </div>
          
          <div class="d-flex align-items-center gap-2 mb-3">
            <button type="button" class="dicas-b d-flex align-items-center justify-content-center text-white">
              <span class="material-symbols-outlined">lightbulb</span>
            </button>
            <div class="card dicas flex-grow-1 p-2 d-none">
              </div>
          </div>
          
          <div class="card p-3 text-center text-danger-emphasis bg-danger-subtle border-danger-subtle rounded-3">
            <span>O correto é perro...</span>
          </div>

        </div>
      </div>
    </div>
    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
