<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>-Quiz en Español-</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-night">
    <canvas id="shaderCanvas" class="aurora"></canvas>
  </div>

  <div class="container p-5">
    <h2 class="title mb-5 text-center">Quiz en español</h2>

    <div id="screen-setup" class="card p-4 mx-auto" style="max-width: 500px;">
      <h3 class="text-center mb-4">Configurar Jogadores</h3>
      <div class="mb-3">
        <label for="input-p1" class="form-label">Nome do Player 1:</label>
        <input type="text" id="input-p1" class="form-control" value="Player 1">
      </div>
      <div class="mb-4">
        <label for="input-p2" class="form-label">Nome do Player 2:</label>
        <input type="text" id="input-p2" class="form-control" value="Player 2">
      </div>
      <button id="start-game-btn" class="btn btn-primary w-100">Iniciar Jogo</button>
    </div>

    <div id="screen-game" class="card d-none">
      <div class="card-body">
        <div class="players mb-3">
          <div id="player-indicator" aria-hidden="true"></div>
          <h4 class="Player1 player quiz" id="display-p1">Player 1</h4>
          <h4 class="Player2 player" id="display-p2">Player 2</h4>
        </div>

        <div class="d-flex justify-content-between mb-3 text-muted px-2">
          <small>Dicas de <span id="hint-name-p1">P1</span>: <span id="hints-count-p1">3</span></small>
          <small>Dicas de <span id="hint-name-p2">P2</span>: <span id="hints-count-p2">3</span></small>
        </div>

        <div class="progress mb-3" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0"></div>
        </div>

        <div class="card card-question mb-4 p-3">
          <span id="question-text">Carregando pergunta...</span>
        </div>

        <div id="answers-container" class="responces"></div>

        <div id="answer-input-wrapper" class="mb-3 d-none">
          <input id="answer-input" type="text" class="form-control" placeholder="Digite sua resposta aqui" autocomplete="off">
          <button id="answer-submit" class="btn btn-primary mt-3">Enviar resposta</button>
        </div>

        <div class="d-flex justify-content-around align-items-center mb-3">
          <button class="dicas-b me-3 btn btn-outline-warning"><span class="material-symbols-outlined">lightbulb</span></button>
          <button id="next-button" class="btn btn-success d-none">Próxima pergunta</button>
        </div>

        <div class="card p-3">
          <span id="feedback-text" class="text-dark">Suas respostas aparecerão aqui.</span>
        </div>
      </div>
    </div>

    <div id="screen-victory" class="card p-5 text-center d-none mx-auto" style="max-width: 600px;">
      <span class="material-symbols-outlined text-warning" style="font-size: 4rem;">trophy</span>
      <h2 class="mt-3" id="victory-title">Fim de Jogo!</h2>
      <hr>
      <div class="my-4">
        <h3>Placar Final:</h3>
        <p class="fs-4" id="score-p1">Player 1: 0 acertos</p>
        <p class="fs-4" id="score-p2">Player 2: 0 acertos</p>
      </div>
      <button id="restart-game-btn" class="btn btn-success lg w-100">Jogar Novamente</button>
    </div>

  </div>

  <script src="script.js"></script>
  <script src="src/shaders/aurora.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
