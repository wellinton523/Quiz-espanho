<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <title>Hello, World!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body>
    <div class="conteiner p-5">
      <h2 class="title mb-5">Quiz en enpanõl</h2>
      <div class="card">
        <div class="card-body">
          <div class="players mb-3">
            <h4 class="Player1 player quiz">Player 1</h4>
            <h4 class="Player2 player">Player 2</h4>
          </div>
          <div class="card mb-4">
            <span>Como é chamado cachorro em espanho?</span>
          </div>
          <div class="responces">
            <button type="a" class="option"><div class="alert alert-success option-box" role="alert">A: Perro</div></button>
            <button type="b" class="option"><div class="alert alert-danger option-box" role="alert">B: Cacholo</div></button>
            <button type="c" class="option"><div class="alert alert-dark option-box" role="alert">C: Dog</div></button>
            <button type="d" class="option"><div class="alert alert-light option-box" role="alert">D: Nenhuma opção</div></button>
            
          </div>
          <button class="dicas-b"><span class="material-symbols-outlined">lightbulb</span></button>
          <div class="card dicas">

          </div>
          <div class="card">
            <span>O correto é perro... seu burro</span>
          </div>
        </div>
        
      </div>
    </div>
      <script src="script.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
