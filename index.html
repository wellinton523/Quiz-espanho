<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body>
    <div class="conteiner p-5">
      <h2 class="title mb-5">Quiz en enpanõl</h2>
      <div class="card">
        <div class="card-body">
          <div class="players mb-3">
            <div id="player-indicator" aria-hidden="true"></div>
            <h4 class="Player1 player quiz">Player 1</h4>
            <h4 class="Player2 player">Player 2</h4>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0"></div>
          </div>
          <div class="card mb-4">
            <span id="question-text">Carregando pergunta...</span>
          </div>
          <div id="answers-container" class="responces"></div>
          <div id="answer-input-wrapper" class="mb-3 d-none">
            <input id="answer-input" type="text" class="form-control" placeholder="Digite sua resposta aqui" autocomplete="off">
            <button id="answer-submit" class="btn btn-primary mt-3">Enviar resposta</button>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="dicas-b me-3"><span class="material-symbols-outlined">lightbulb</span></button>
            <button id="next-button" class="btn btn-success d-none">Próxima pergunta</button>
          </div>
          <div class="card">
            <span id="feedback-text">Suas respostas aparecerão aqui.</span>
          </div>
        </div>
        
      </div>
    </div>
      <script src="script.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
